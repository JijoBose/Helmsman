{% extends "layout.html" %}

{% block title %}Containers - Helmsman{% endblock %}

{% block content %}
<div class="stack-lg">
  <header class="page-head">
    <div>
      <h1>Containers</h1>
      <p class="lede">What is on your servers right now, from Kamal's read-only detail commands.</p>
    </div>
    <div class="cluster">
      <div class="seg" role="group" aria-label="Container view">
        <a class="seg-btn" href="/containers" {% if view == "table" %}aria-current="page"{% endif %}>Table</a>
        <a class="seg-btn" href="/containers?view=hosts" {% if view == "hosts" %}aria-current="page"{% endif %}>By host</a>
      </div>
      <button class="btn btn-secondary btn-sm" hx-get="/containers/status?view={{ view }}" hx-target="#fleet" hx-swap="innerHTML" hx-disabled-elt="this">
        <span class="spinner htmx-indicator" aria-hidden="true"></span>
        <svg class="icon htmx-indicator-hide" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
        Refresh
      </button>
    </div>
  </header>

  <label class="field">
    Find a container
    <input id="container-search" type="search" placeholder="Name, host, role, or stopped" autocomplete="off">
  </label>
  <p id="filter-status" class="sr-only" aria-live="polite"></p>
  <p id="filter-empty" class="card empty" hidden>Nothing matches that search.</p>

  <div id="fleet" class="stack" hx-get="/containers/status?view={{ view }}" hx-trigger="load" hx-swap="innerHTML">
    <section class="banner banner-neutral" role="status">
      <p class="banner-kicker">Checking</p>
      <p class="banner-title">Looking at your containers…</p>
    </section>
  </div>
</div>

<script>
(function () {
  var currentRole = "";

  function applyFilter() {
    var input = document.getElementById("container-search");
    var query = input ? input.value.trim().toLowerCase() : "";
    var buttons = document.querySelectorAll("#fleet [data-role-filter]");
    var known = currentRole === "";
    buttons.forEach(function (button) {
      var role = button.getAttribute("data-role-filter") || "";
      if (role === currentRole) known = true;
      var pressed = role === currentRole;
      button.setAttribute("aria-pressed", pressed ? "true" : "false");
    });
    if (!known) currentRole = "";

    var rows = document.querySelectorAll("#fleet [data-container]");
    var shown = 0;
    rows.forEach(function (row) {
      var text = (row.getAttribute("data-search") || "").toLowerCase();
      var role = row.getAttribute("data-role") || "";
      var visible = (currentRole === "" || role === currentRole) && (query === "" || text.indexOf(query) !== -1);
      row.hidden = !visible;
      if (visible) shown += 1;
    });
    document.querySelectorAll("#fleet [data-host-card]").forEach(function (card) {
      card.hidden = !card.querySelector("[data-container]:not([hidden])");
    });

    var empty = document.getElementById("filter-empty");
    if (empty) empty.hidden = rows.length === 0 || shown > 0;
    var status = document.getElementById("filter-status");
    if (status) {
      if (!query && !currentRole) status.textContent = "";
      else status.textContent = "Showing " + shown + " containers.";
    }
  }

  document.addEventListener("input", function (event) {
    if (event.target && event.target.id === "container-search") applyFilter();
  });
  document.addEventListener("click", function (event) {
    var button = event.target.closest ? event.target.closest("[data-role-filter]") : null;
    if (!button) return;
    var role = button.getAttribute("data-role-filter") || "";
    currentRole = currentRole === role ? "" : role;
    applyFilter();
  });
  document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.target && event.target.id === "fleet") applyFilter();
  });
})();
</script>
{% endblock %}
