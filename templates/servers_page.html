{% extends "layout.html" %}

{% block title %}Servers - Helmsman{% endblock %}

{% block content %}
<section class="space-y-5">
  <div class="flex items-center gap-3 text-sm">
    <div class="flex items-center gap-2 rounded bg-slate-100 border border-slate-200 px-3 py-1 text-slate-700">
      <span class="font-medium">servers</span>
    </div>
  </div>

  <div class="flex items-center border-b border-slate-200 text-sm">
    <a href="/containers" class="tab px-4 py-2 font-medium tab-active">Containers</a>
    <a href="/logs" class="tab px-4 py-2 text-slate-500 hover:text-slate-900">Logs</a>
    <a href="/requests" class="tab px-4 py-2 text-slate-500 hover:text-slate-900">Requests</a>
    <a href="/config" class="tab px-4 py-2 text-slate-500 hover:text-slate-900">Config</a>
    <a href="/activity" class="tab px-4 py-2 text-slate-500 hover:text-slate-900">Activity</a>
  </div>

  <div class="flex items-center justify-between">
    <div></div>
    <button
      class="inline-flex items-center gap-2 rounded-md border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
      hx-get="/servers/status"
      hx-target="#servers-content"
      hx-swap="innerHTML">
      ↻ Refresh
    </button>
  </div>

  <div id="servers-content" class="content-card rounded-xl p-1">
    {% include "servers.html" %}
  </div>
</section>
{% endblock %}
