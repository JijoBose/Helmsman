{% extends "layout.html" %}

{% block title %}Servers - Helmsman{% endblock %}

{% block content %}
<section class="space-y-5">
  <div>
    <h1 class="page-title">Servers</h1>
    <p class="mt-1 caption">Running containers grouped by host.</p>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="seg" role="group" aria-label="Container view">
      <a href="/containers" class="seg-btn">Table</a>
      <a href="/servers" class="seg-btn" aria-current="page">By host</a>
    </div>
    <button
      class="btn btn-secondary btn-sm"
      hx-get="/servers/status"
      hx-target="#servers-content"
      hx-swap="innerHTML"
      hx-disabled-elt="this">
      <span class="spinner htmx-indicator" aria-hidden="true"></span>
      <svg class="icon h-3.5 w-3.5 htmx-indicator-hide" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
      Refresh
    </button>
  </div>

  <div id="servers-content" class="swap-fade">
    {% include "servers.html" %}
  </div>
</section>
{% endblock %}
