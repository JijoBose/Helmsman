{% extends "layout.html" %}

{% block title %}Logs - Helmsman{% endblock %}

{% block content %}
<div class="stack-lg">
  <header class="page-head">
    <div>
      <h1>Logs</h1>
      <p class="lede">Recent output from the app containers. Following the log only reads new lines.</p>
    </div>
    <div class="cluster">
      <div class="seg" aria-label="How many lines to load">
        <a class="seg-btn" href="/logs?tail=100" {% if tail == 100 %}aria-current="page"{% endif %}>100</a>
        <a class="seg-btn" href="/logs?tail=200" {% if tail == 200 %}aria-current="page"{% endif %}>200</a>
        <a class="seg-btn" href="/logs?tail=500" {% if tail == 500 %}aria-current="page"{% endif %}>500</a>
      </div>
      <button id="live-btn" class="btn btn-primary" type="button" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
        Follow live
      </button>
      <button class="btn btn-secondary" type="button" hx-get="/logs/recent?tail={{ tail }}" hx-target="#log-output" hx-swap="innerHTML" hx-disabled-elt="this" hx-on::before-request="window.hmLogs && hmLogs.stop()">
        <span class="spinner htmx-indicator" aria-hidden="true"></span>
        <svg class="icon htmx-indicator-hide" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
        Refresh
      </button>
    </div>
  </header>

  <div class="cluster">
    <label class="field">
      Find in these lines
      <input id="log-search" type="search" placeholder="Error, request id, path…" autocomplete="off">
    </label>
    <label class="check"><input id="stick-bottom" type="checkbox" checked> Keep the latest line in view</label>
    <span id="live-indicator" class="pill pill-neutral">Showing the latest {{ tail }}</span>
  </div>

  <div class="card" style="overflow: hidden">
    <div id="log-output" class="terminal" role="log" aria-label="Container logs" aria-live="off" hx-get="/logs/recent?tail={{ tail }}" hx-trigger="load" hx-swap="innerHTML">
      <p class="log-empty">Loading recent logs…</p>
    </div>
  </div>
</div>

<script>
(function () {
  var source = null;
  var tail = "{{ tail }}";
  var play = '<svg class="icon" aria-hidden="true"><use href="#i-play"/></svg> Follow live';
  var stop = '<svg class="icon" aria-hidden="true"><use href="#i-square"/></svg> Stop following';

  function output() { return document.getElementById("log-output"); }
  function stick() {
    var box = document.getElementById("stick-bottom");
    return !box || box.checked;
  }
  function scrollDown() {
    var out = output();
    if (out && stick()) out.scrollTop = out.scrollHeight;
  }
  function applySearch() {
    var input = document.getElementById("log-search");
    var query = input ? input.value.trim().toLowerCase() : "";
    var out = output();
    if (!out) return;
    out.querySelectorAll(".log-line").forEach(function (line) {
      var text = line.textContent.toLowerCase();
      line.hidden = query !== "" && text.indexOf(query) === -1;
    });
  }
  function setIndicator(kind, label, live) {
    var el = document.getElementById("live-indicator");
    if (!el) return;
    el.className = "pill pill-" + kind + (live ? " pill-live" : "");
    el.textContent = label;
  }
  function stopLive() {
    if (source) { source.close(); source = null; }
    var button = document.getElementById("live-btn");
    if (button) { button.className = "btn btn-primary"; button.innerHTML = play; button.setAttribute("aria-pressed", "false"); }
    setIndicator("neutral", "Showing the latest " + tail, false);
  }
  function append(text) {
    var out = output();
    if (!out) return;
    var line = document.createElement("pre");
    line.className = "log-line";
    line.textContent = text;
    out.appendChild(line);
    while (out.querySelectorAll(".log-line").length > 1500) {
      var first = out.querySelector(".log-line");
      if (first) first.remove();
      else break;
    }
    applySearch();
    scrollDown();
  }

  document.getElementById("live-btn").addEventListener("click", function () {
    if (source) { stopLive(); return; }
    source = new EventSource("/logs/stream?tail=" + encodeURIComponent(tail));
    this.className = "btn btn-danger";
    this.innerHTML = stop;
    this.setAttribute("aria-pressed", "true");
    setIndicator("success", "Following live", true);
    source.onmessage = function (event) { append(event.data); };
    source.onerror = function () {
      stopLive();
      setIndicator("warning", "The live log stopped. Follow again to retry.", false);
    };
  });
  document.getElementById("log-search").addEventListener("input", applySearch);
  document.body.addEventListener("htmx:beforeSwap", function (event) {
    if (event.detail.target && event.detail.target.id === "log-output" && source) {
      event.detail.shouldSwap = false;
    }
  });
  document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.target && event.target.id === "log-output") {
      applySearch();
      scrollDown();
    }
  });
  var out = output();
  if (out) {
    out.addEventListener("scroll", function () {
      var box = document.getElementById("stick-bottom");
      if (!box) return;
      var nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 48;
      if (!nearBottom) box.checked = false;
    });
  }
  window.hmLogs = { stop: stopLive };
})();
</script>
{% endblock %}
