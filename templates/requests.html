{% extends "layout.html" %}

{% block title %}Traffic - Helmsman{% endblock %}

{% block content %}
<div class="stack-lg">
  <header class="page-head">
    <div>
      <h1>Traffic</h1>
      <p class="lede">Recent HTTP requests from the Kamal proxy log. This is a sample of the latest lines, not a full analytics report.</p>
    </div>
    <button class="btn btn-secondary btn-sm" hx-get="/requests/list" hx-target="#traffic" hx-swap="innerHTML" hx-disabled-elt="this">
      <span class="spinner htmx-indicator" aria-hidden="true"></span>
      <svg class="icon htmx-indicator-hide" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
      Refresh
    </button>
  </header>

  <label class="field">
    Find a request
    <input id="traffic-search" type="search" placeholder="Path, host, or method" autocomplete="off">
  </label>
  <p id="traffic-status" class="sr-only" aria-live="polite"></p>

  <div id="traffic" class="stack" hx-get="/requests/list" hx-trigger="load" hx-swap="innerHTML">
    <section class="banner banner-neutral">
      <p class="banner-kicker">Checking</p>
      <p class="banner-title">Reading proxy logs…</p>
    </section>
  </div>
</div>

<script>
(function () {
  var active = null;

  function apply() {
    var input = document.getElementById("traffic-search");
    var query = input ? input.value.trim().toLowerCase() : "";
    var rows = document.querySelectorAll("#requests-table tbody tr");
    document.querySelectorAll("[data-prefix]").forEach(function (card) {
      var prefix = card.getAttribute("data-prefix");
      var on = active === null ? prefix === "" : prefix === active;
      card.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var shown = 0;
    rows.forEach(function (row) {
      var status = row.getAttribute("data-status") || "";
      var text = (row.getAttribute("data-search") || "").toLowerCase();
      var statusOk = !active || status.indexOf(active) === 0;
      var textOk = !query || text.indexOf(query) !== -1;
      var visible = statusOk && textOk;
      row.hidden = !visible;
      if (visible) shown += 1;
    });
    var live = document.getElementById("traffic-status");
    if (live) {
      if (!active && !query) live.textContent = "";
      else live.textContent = "Showing " + shown + " requests.";
    }
  }

  document.addEventListener("click", function (event) {
    var card = event.target.closest ? event.target.closest("[data-prefix]") : null;
    if (!card || !card.closest("#traffic")) return;
    var prefix = card.getAttribute("data-prefix");
    if (prefix === "") active = null;
    else active = active === prefix ? null : prefix;
    apply();
  });
  document.addEventListener("input", function (event) {
    if (event.target && event.target.id === "traffic-search") apply();
  });
  document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.target && event.target.id === "traffic") apply();
  });
})();
</script>
{% endblock %}
