<table class="data-table">
  <thead>
    <tr>
      <th>Status</th>
      <th>Container</th>
      <th>Host</th>
      <th>Image</th>
      <th>For</th>
    </tr>
  </thead>
  <tbody>
    {% for server in servers %}
      {% for container in server.containers %}
      <tr data-container data-role="{{ container.role }}" data-search="{{ container.name }} {{ container.role }} {{ container.host }} {{ container.status_label }} {{ container.image }}">
        <td><span class="pill {{ container.status_class }}"><span class="pill-dot" aria-hidden="true"></span>{{ container.status_label }}</span></td>
        <td>
          <div class="name truncate" title="{{ container.name }}">{{ container.name }}</div>
          <div class="sub">{{ container.role }}</div>
        </td>
        <td class="mono">{{ container.host }}</td>
        <td><div class="mono truncate" title="{{ container.image }}">{{ container.image }}</div></td>
        <td class="muted" title="{{ container.status_detail }}">{{ container.running_for }}</td>
      </tr>
      {% endfor %}
    {% endfor %}
  </tbody>
</table>
