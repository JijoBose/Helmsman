<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Helmsman{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <style>
      /* ---- Base typography ---- */
      html { -webkit-text-size-adjust: 100%; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f8fafc;
        color: #0f172a;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .tnum { font-variant-numeric: tabular-nums; }

      /* ---- Deploy / container log lines (server-emitted markup contract) ---- */
      .log-line { margin: 0; padding: 0.15rem 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.5; color: #0f172a; }
      .log-info { color: #64748b; }
      .log-building { color: #2563eb; }
      .log-pushing { color: #6366f1; }
      .log-deploying { color: #b45309; }
      .log-health-check { color: #0891b2; }
      .log-done { color: #047857; }
      .log-error { color: #dc2626; }

      /* Dark terminal overrides for deploy logs etc. */
      .terminal .log-line { color: #e2e8f0; }
      .terminal .log-info { color: #94a3b8; }
      .terminal .log-building { color: #93c5fd; }
      .terminal .log-pushing { color: #a5b4fc; }
      .terminal .log-deploying { color: #fcd34d; }
      .terminal .log-health-check { color: #67e8f9; }
      .terminal .log-done { color: #86efac; }
      .terminal .log-error { color: #fca5a5; }
      .terminal {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: #0b1220;
        color: #e2e8f0;
        line-height: 1.5;
        font-variant-ligatures: none;
      }

      /* ---- Icon system (Lucide sprite referenced via <use>) ---- */
      .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

      /* ---- Page + section headings ---- */
      .page-title { font-size: 1.5rem; line-height: 2rem; font-weight: 600; letter-spacing: -.015em; color: #0f172a; }
      .eyebrow { font-size: .6875rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #64748b; }
      .section-title { font-size: .875rem; font-weight: 600; color: #0f172a; letter-spacing: -.006em; }
      .caption { font-size: .75rem; line-height: 1rem; color: #64748b; }

      /* ---- Links ---- */
      .link { color: #1d4ed8; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
      .link:hover { color: #1e40af; }

      /* ---- Cards (own the md radius) ---- */
      .content-card { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; }
      .metric-card  { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; transition: border-color .1s ease, box-shadow .1s ease; }
      .metric-card.is-interactive:hover { border-color: #cbd5e1; box-shadow: 0 1px 2px rgb(15 23 42 / .06); }
      .status-card { border-radius: .75rem; transition: box-shadow .1s ease; }
      .status-card:hover { box-shadow: 0 1px 3px rgb(15 23 42 / 0.08); }

      /* ---- Buttons ---- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: .5rem;
             padding: .5rem .875rem; font-size: .875rem; font-weight: 600; line-height: 1; border: 1px solid transparent;
             cursor: pointer; white-space: nowrap; transition: background-color .1s ease, border-color .1s ease, transform .04s ease; }
      .btn:disabled { opacity: .55; cursor: not-allowed; }
      .btn:active:not(:disabled) { transform: translateY(.5px); }
      .btn-primary   { background: #2563eb; color: #fff; }
      .btn-primary:hover:not(:disabled)   { background: #1d4ed8; }
      .btn-secondary { background: #fff; color: #334155; border-color: #e2e8f0; }
      .btn-secondary:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
      .btn-danger    { background: #fff; color: #dc2626; border-color: #fecaca; }
      .btn-danger:hover:not(:disabled)    { background: #fef2f2; border-color: #fca5a5; }
      .btn-warning   { background: #fffbeb; color: #b45309; border-color: #fde68a; }
      .btn-warning:hover:not(:disabled)   { background: #fef3c7; border-color: #fcd34d; }
      .btn-ghost     { background: transparent; color: #475569; }
      .btn-ghost:hover:not(:disabled)     { background: #f1f5f9; color: #0f172a; }
      .btn-sm { padding: .3125rem .625rem; font-size: .8125rem; }

      /* ---- Icon-only button ---- */
      .icon-btn { display: inline-flex; align-items: center; justify-content: center; height: 1.75rem; width: 1.75rem;
                  border-radius: .375rem; color: #64748b; cursor: pointer; background: transparent; border: 0;
                  transition: background-color .1s ease, color .1s ease; }
      .icon-btn:hover { background: #f1f5f9; color: #0f172a; }
      .terminal-bar .icon-btn { color: #cbd5e1; }
      .terminal-bar .icon-btn:hover { background: #334155; color: #fff; }

      /* ---- Chips & context pills ---- */
      .chip { display: inline-flex; align-items: center; gap: .25rem; border-radius: .375rem; background: #f1f5f9;
              color: #475569; padding: .0625rem .5rem; font-size: .75rem; font-weight: 500; }
      .context-chip { display: inline-flex; align-items: center; gap: .375rem; border-radius: .375rem; background: #f1f5f9;
              border: 1px solid #e2e8f0; color: #334155; padding: .25rem .75rem; font-size: .875rem; }

      /* ---- Status pills ---- */
      .pill { display: inline-flex; align-items: center; gap: .375rem; border-radius: 9999px; padding: .125rem .625rem;
              font-size: .75rem; font-weight: 600; line-height: 1.25; }
      .pill-success { background: #d1fae5; color: #047857; }
      .pill-neutral { background: #f1f5f9; color: #475569; }
      .pill-danger  { background: #fee2e2; color: #b91c1c; }
      .pill-warning { background: #fef3c7; color: #b45309; }
      .pill-info    { background: #dbeafe; color: #1d4ed8; }
      .pill-dot { height: .5rem; width: .5rem; border-radius: 9999px; background: currentColor; flex: none; }
      .pill-live .pill-dot { animation: hm-pulse 1.4s ease-in-out infinite; }
      @keyframes hm-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }

      /* ---- Segmented view switcher ---- */
      .seg { display: inline-flex; gap: .1875rem; padding: .1875rem; border-radius: .5rem; background: #f1f5f9; border: 1px solid #e2e8f0; }
      .seg-btn { display: inline-flex; align-items: center; gap: .375rem; padding: .25rem .75rem; border-radius: .375rem; font-size: .8125rem; font-weight: 500; color: #475569; }
      .seg-btn:hover { color: #0f172a; }
      .seg-btn[aria-current="page"] { background: #fff; color: #0f172a; font-weight: 600; box-shadow: 0 1px 2px rgb(15 23 42 / .08); }

      /* ---- Top-nav links ---- */
      .nav-link { transition: background-color .1s ease, color .1s ease; }

      /* ---- Terminal titlebar (dark) ---- */
      .terminal-bar { display: flex; align-items: center; justify-content: space-between; background: #111a2e; color: #cbd5e1;
              border-bottom: 1px solid #1e293b; padding: .375rem .75rem; font-size: .75rem; }

      /* ---- Empty & message blocks ---- */
      .empty-state { border: 1px solid #e2e8f0; background: #fff; border-radius: .75rem; padding: 2.5rem 2rem; text-align: center; }
      .msg-block { border-radius: .75rem; padding: 1rem; font-size: .875rem; white-space: pre-wrap; }
      .error-block   { border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; border-radius: .75rem; padding: 1rem; font-size: .875rem; white-space: pre-wrap; }
      .success-block { border: 1px solid #a7f3d0; background: #ecfdf5; color: #047857; border-radius: .75rem; padding: 1rem; font-size: .875rem; }
      .warning-block { border: 1px solid #fde68a; background: #fffbeb; color: #b45309; border-radius: .75rem; padding: 1rem; font-size: .875rem; }

      /* ---- Form fields ---- */
      .field-label { display: grid; gap: .25rem; font-size: .75rem; font-weight: 500; color: #475569; }
      .field-input { background: #fff; border: 1px solid #cbd5e1; border-radius: .375rem; padding: .375rem .5rem;
              font-size: .875rem; color: #0f172a; }
      .field-input:hover { border-color: #94a3b8; }

      /* ---- Focus visibility (WCAG 2.4.7) ---- */
      :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; border-radius: 2px; }
      input:focus, textarea:focus, select:focus { outline: 2px solid #2563eb; outline-offset: 1px; }

      /* ---- htmx loading feedback ---- */
      .htmx-indicator { display: none; }
      .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
      .htmx-request .htmx-indicator-hide { display: none; }
      button.htmx-request, .btn.htmx-request { opacity: .75; pointer-events: none; }
      .spinner { height: .875rem; width: .875rem; border: 2px solid currentColor; border-right-color: transparent;
              border-radius: 9999px; display: inline-block; animation: hm-spin .6s linear infinite; }
      @keyframes hm-spin { to { transform: rotate(360deg); } }
      /* Cross-fade auto-refreshed panels instead of a hard pop */
      .swap-fade.htmx-swapping { opacity: .45; transition: opacity .12s ease; }

      /* ---- Utilities ---- */
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-950">
    {% include "icons.html" %}
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
        <div class="flex shrink-0 items-center gap-3">
          <a href="/" class="flex items-center gap-2.5 text-lg font-semibold tracking-tight text-slate-900">
            <span class="inline-flex h-7 w-7 items-center justify-center rounded-md bg-slate-900 text-white" aria-hidden="true">
              <svg class="icon h-4 w-4"><use href="#i-ship-wheel"/></svg>
            </span>
            <span>Helmsman</span>
          </a>
          <span class="chip hidden md:inline-flex">Kamal</span>
        </div>
        <div class="no-scrollbar min-w-0 overflow-x-auto">
          <nav aria-label="Primary" class="flex min-w-0 items-center gap-1 whitespace-nowrap text-sm font-medium">
            <a href="/deploy" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "deploy" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "deploy" %}aria-current="page"{% endif %}>Deploy</a>
            <span class="mx-1 h-5 w-px shrink-0 bg-slate-200" aria-hidden="true"></span>
            <a href="/containers" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "containers" || active == "servers" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "containers" || active == "servers" %}aria-current="page"{% endif %}>Containers</a>
            <a href="/logs" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "logs" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "logs" %}aria-current="page"{% endif %}>Logs</a>
            <a href="/requests" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "requests" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "requests" %}aria-current="page"{% endif %}>Requests</a>
            <a href="/activity" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "activity" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "activity" %}aria-current="page"{% endif %}>Activity</a>
            <a href="/history" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "history" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "history" %}aria-current="page"{% endif %}>History</a>
            <span class="mx-1 h-5 w-px shrink-0 bg-slate-200" aria-hidden="true"></span>
            <a href="/config" class="nav-link shrink-0 rounded-md px-3 py-1.5 {% if active == "config" %}bg-slate-100 font-semibold text-slate-900{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}" {% if active == "config" %}aria-current="page"{% endif %}>Config</a>
          </nav>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-7xl px-4 pb-8 sm:px-6 lg:px-8">
      <p class="caption">Helmsman — local browser UI for <span class="mono">Kamal</span> · Run from your project root</p>
    </footer>
  </body>
</html>
