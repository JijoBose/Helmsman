<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Helmsman{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <style>
      .log-line { margin: 0; padding: 0.25rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .log-info { color: #cbd5e1; }
      .log-building { color: #93c5fd; }
      .log-pushing { color: #a5b4fc; }
      .log-deploying { color: #fcd34d; }
      .log-health-check { color: #67e8f9; }
      .log-done { color: #86efac; }
      .log-error { color: #fca5a5; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-950">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
        <a href="/deploy" class="text-lg font-semibold tracking-normal">Helmsman</a>
        <nav class="flex items-center gap-1 text-sm font-medium">
          <a href="/deploy" class="rounded-md px-3 py-2 {% if active == "deploy" %}bg-slate-950 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Deploy</a>
          <a href="/config" class="rounded-md px-3 py-2 {% if active == "config" %}bg-slate-950 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Config</a>
          <a href="/history" class="rounded-md px-3 py-2 {% if active == "history" %}bg-slate-950 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">History</a>
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-5 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
