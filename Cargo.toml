[package]
name = "helmsman"
version = "1.1.1"
edition = "2024"

[dependencies]
askama = "0.12"
async-stream = "0.3"
axum = "0.7"
futures-core = "0.3"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
